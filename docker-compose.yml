services:
  postgres:
    image: postgres:16-alpine
    container_name: soulsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soulsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulsync_dev}
      POSTGRES_DB: ${POSTGRES_DB:-soulsync}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-soulsync} -d ${POSTGRES_DB:-soulsync}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: soulsync-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    profiles: ['proxy']
    image: nginx:1.27-alpine
    container_name: soulsync-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
