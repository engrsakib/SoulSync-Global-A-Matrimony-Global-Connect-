name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm turbo run db:generate

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Scan TODO/FIXME
        run: pnpm check:todos

      - name: Validate Prisma schema
        run: pnpm --filter @soulsync/db exec prisma validate

  build:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soulsync
          POSTGRES_PASSWORD: soulsync_dev
          POSTGRES_DB: soulsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soulsync -d soulsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://soulsync:soulsync_dev@localhost:5432/soulsync?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-jwt-access-secret-min-16-chars
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-min-16-chars
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm turbo run db:generate

      - name: Build
        run: pnpm turbo run build

      - name: Deploy migrations
        run: pnpm --filter @soulsync/db db:deploy

      - name: Test
        run: pnpm turbo run test
